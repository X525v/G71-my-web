<!DOCTYPE html>
<html>
<head>
    <title>Login Access</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="parallax-bg">

<div class="login-card glass scroll-anim">
    <img src="assets/logo.png" class="login-logo">

    <h2>Enter Access Password</h2>

    <input type="password" id="pass" placeholder="Enter Password...">

    <button class="btn" onclick="check()">Enter</button>

    <p id="error" style="color:red;margin-top:10px;display:none;">Wrong Password!</p>
</div>


<script>
function check() {
    const p = document.getElementById("pass").value;
    if (p === "abiesccg71") {
        window.location.href = "index.html";
    } else {
        document.getElementById("error").style.display = "block";
    }
}

// Scroll Animations
const elements = document.querySelectorAll(".scroll-anim");
function showOnScroll() {
  elements.forEach(el => {
    const rect = el.getBoundingClientRect();
    if (rect.top < window.innerHeight - 60) el.classList.add("show");
  });
}
window.addEventListener("scroll", showOnScroll);
showOnScroll();
</script>

</body>
</html>
